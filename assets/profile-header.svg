<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alexander — Full-Stack Developer</title>
  <desc id="desc">A restrained graphite profile banner with the name Alexander and the focus areas full-stack development, quality assurance, and digital analytics.</desc>

  <defs>
    <linearGradient id="background" x1="80" y1="0" x2="1120" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="0.55" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52525B" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#A1A1AA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#52525B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 60) rotate(135) scale(390 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71717A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#18181B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FAFAFA" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.25" stroke="#A1A1AA" stroke-opacity="0.22" stroke-width="1.5"/>

  <path d="M80 78H176" stroke="#D4D4D8" stroke-width="2"/>
  <circle cx="70" cy="78" r="4" fill="#D4D4D8"/>
  <text x="80" y="106" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="3">ALEKDSANS / POLAND</text>

  <text x="70" y="196" fill="#FAFAFA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">ALEXANDER</text>
  <rect x="71" y="220" width="810" height="1" fill="url(#line)"/>
  <text x="72" y="258" fill="#D4D4D8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2.4">FULL-STACK DEVELOPMENT / QA / DIGITAL ANALYTICS</text>

  <g opacity="0.75">
    <circle cx="1054" cy="160" r="86" stroke="#71717A"/>
    <circle cx="1054" cy="160" r="58" stroke="#52525B"/>
    <circle cx="1054" cy="160" r="8" fill="#E4E4E7"/>
    <path d="M932 160H1176M1054 38V282" stroke="#A1A1AA" stroke-opacity="0.45"/>
    <path d="M969 75L1139 245M1139 75L969 245" stroke="#52525B" stroke-opacity="0.5"/>
    <circle cx="1139" cy="75" r="4" fill="#D4D4D8"/>
    <circle cx="969" cy="245" r="4" fill="#A1A1AA"/>
  </g>
